# Backend CI/CD Workflow
#
# This workflow builds, tests, and deploys the backend application.
# It triggers on pushes to main branch and version tags (v*.*.*).
#
# Required GitHub Secrets:
#   DOCKER_CONFIG_JSON       - Docker config JSON with registry auth (from ~/.docker/config.json)
#   DO_REGISTRY              - DigitalOcean registry URL (e.g., registry.digitalocean.com)
#   DO_REGISTRY_IMAGE        - Base image name (without -backend suffix)

name: Backend CI/CD

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  # ============================================
  # COMPILE JOB
  # Installs dependencies and creates cache for downstream jobs
  # ============================================
  compile:
    name: Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Cache dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --ignore-scripts

  # ============================================
  # QUALITY CHECK JOBS
  # Run in parallel after compile job completes
  # ============================================

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [compile]
    # Remove continue-on-error to make blocking
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Run linter
        run: bun run lint

  tsc:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: [compile]
    # Remove continue-on-error to make blocking
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Run TypeScript compiler
        run: bun tsc

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    needs: [compile]
    # Remove continue-on-error to make blocking
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Run Stylelint
        run: bun stylelint

  # ============================================
  # TEST JOB
  # Runs tests with PostgreSQL, Redis and MinIO containers
  # ============================================
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [compile]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: postgres_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: saas-starter-dev
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_URL: postgresql://postgres_user:postgres_password@localhost:5432/postgres_db
      REDIS_URL: redis://:@localhost:6379/0
      ENVIRONMENT: test
      # Dummy key for tests - actual API calls should be mocked
      OPENAI_API_KEY: sk-test-dummy-key-for-ci
      OBJECT_STORAGE_ACCESS_KEY_ID: minioadmin
      OBJECT_STORAGE_SECRET_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_BUCKET: saas-starter-dev
      OBJECT_STORAGE_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Copy environment files
        run: |
          cp apps/backend/.env.example .env
          cp apps/backend/.env.example packages/database/.env
          cp packages/backend-base/.env.example packages/backend-base/.env

      - name: Run database migrations and seeds
        run: |
          cd packages/database && bun migrate:deploy && bun db:seed && bun seed:themes

      - name: Run tests
        run: cd packages/backend-base && bun test

      - name: Cleanup environment files
        if: always()
        run: rm -rf .env packages/database/.env packages/backend-base/.env

  # ============================================
  # BUILD BACKEND JOB
  # ============================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [lint, tsc, stylelint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Build backend
        run: cd apps/backend && bun run build

      - name: Build database package
        run: cd packages/database && bun run build

  # ============================================
  # DOCKER BUILD AND PUSH JOB
  # Builds Docker image and pushes to DigitalOcean registry
  # ============================================
  docker-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-backend]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Build backend
        run: cd apps/backend && bun run build

      - name: Build database package
        run: cd packages/database && bun run build

      - name: Setup Docker auth
        run: |
          mkdir -p ~/.docker
          echo '${{ secrets.DOCKER_CONFIG_JSON }}' > ~/.docker/config.json

      - name: Pull existing image for cache
        run: docker pull ${{ secrets.DO_REGISTRY }}/${{ secrets.DO_REGISTRY_IMAGE }}-backend:${{ github.ref_name }} || true

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DO_REGISTRY }}/${{ secrets.DO_REGISTRY_IMAGE }}-backend:${{ github.ref_name }} \
            -f apps/backend/Dockerfile \
            --cache-from ${{ secrets.DO_REGISTRY }}/${{ secrets.DO_REGISTRY_IMAGE }}-backend:${{ github.ref_name }} \
            .

      - name: Push Docker image
        run: docker push ${{ secrets.DO_REGISTRY }}/${{ secrets.DO_REGISTRY_IMAGE }}-backend:${{ github.ref_name }}

  # ============================================
  # DEPLOY (no-op — production deploy is NOT handled by this workflow)
  #
  # api.versemate.org runs on DigitalOcean App Platform, which auto-deploys
  # whenever the `:main` image is pushed to the DOCR registry by the
  # docker-push job above. There is no SSH host or docker-compose server to
  # roll onto — app.versemate.org resolves to Cloudflare, and the backend is
  # the App Platform app `verse-mate-backend`. Do NOT add an SSH/docker-compose
  # deploy step here: it cannot connect and would not roll anything out.
  # ============================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deployment handled by App Platform auto-deploy
        run: echo "No action here — DO App Platform auto-deploys the :main image pushed by docker-push. No SSH/compose roll-out exists."
