# Backend CI/CD Workflow
#
# This workflow builds, tests, and deploys the backend application.
# It triggers on pushes to main branch and version tags (v*.*.*).
#
# Required GitHub Secrets:
#   DOCKER_CONFIG_JSON       - Docker config JSON with registry auth (from ~/.docker/config.json)
#   DO_REGISTRY              - DigitalOcean registry URL (e.g., registry.digitalocean.com)
#   DO_REGISTRY_IMAGE        - Base image name (without -backend suffix)
#   OBJECT_STORAGE_ACCESS_KEY_ID     - Object storage credentials
#   OBJECT_STORAGE_SECRET_ACCESS_KEY - Object storage credentials
#   OBJECT_STORAGE_ENDPOINT          - Object storage endpoint URL
#   OBJECT_STORAGE_BUCKET            - Object storage bucket name
#   OBJECT_STORAGE_REGION            - Object storage region

name: Backend CI/CD

on:
  push:
    # TODO: Remove 'feature-github-actions-migration' after PR is merged - keep only [main]
    branches: [main, feature-github-actions-migration]
    tags: ['v*.*.*']

jobs:
  # ============================================
  # COMPILE JOB
  # Installs dependencies and creates cache for downstream jobs
  # ============================================
  compile:
    name: Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Cache dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --ignore-scripts

  # ============================================
  # QUALITY CHECK JOBS
  # Run in parallel after compile job completes
  # ============================================

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [compile]
    # Remove continue-on-error to make blocking
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Run linter
        run: bun run lint

  tsc:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: [compile]
    # Remove continue-on-error to make blocking
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Run TypeScript compiler
        run: bun tsc

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    needs: [compile]
    # Remove continue-on-error to make blocking
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Run Stylelint
        run: bun stylelint

  # ============================================
  # TEST JOB
  # Runs tests with PostgreSQL and Redis service containers
  # ============================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [compile]
    # Remove continue-on-error to make blocking
    continue-on-error: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres_user
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: postgres_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: postgresql://postgres_user:postgres_password@localhost:5432/postgres_db
      REDIS_URL: redis://:@localhost:6379/0
      ENVIRONMENT: test
      # Dummy key for tests - actual API calls should be mocked
      OPENAI_API_KEY: sk-test-dummy-key-for-ci
      OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.OBJECT_STORAGE_ACCESS_KEY_ID }}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.OBJECT_STORAGE_SECRET_ACCESS_KEY }}
      OBJECT_STORAGE_ENDPOINT: ${{ secrets.OBJECT_STORAGE_ENDPOINT }}
      OBJECT_STORAGE_BUCKET: ${{ secrets.OBJECT_STORAGE_BUCKET }}
      OBJECT_STORAGE_REGION: ${{ secrets.OBJECT_STORAGE_REGION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Copy environment files
        run: |
          cp apps/backend/.env.example .env
          cp apps/backend/.env.example packages/database/.env
          cp packages/backend-base/.env.example packages/backend-base/.env

      - name: Run database migrations and seeds
        run: |
          cd packages/database && bun migrate:deploy && bun db:seed && bun seed:themes

      - name: Run tests
        run: cd packages/backend-base && bun test

      - name: Cleanup environment files
        if: always()
        run: rm -rf .env packages/database/.env packages/backend-base/.env

  # ============================================
  # BUILD BACKEND JOB
  # Builds backend and database packages, uploads artifacts
  # ============================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [lint, tsc, stylelint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Build backend
        run: cd apps/backend && bun run build

      - name: Build database package
        run: cd packages/database && bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          retention-days: 1
          path: |
            apps/backend/dist
            packages/database/dist
            packages/database/migrations
            packages/backend-base/src/bible/data/key_english.json
            packages/backend-base/src/bible/data/NASB1995.json

  # ============================================
  # DOCKER BUILD AND PUSH JOB
  # Builds Docker image and pushes to DigitalOcean registry
  # ============================================
  docker-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-backend]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build

      - name: Setup Docker auth
        run: |
          mkdir -p ~/.docker
          echo '${{ secrets.DOCKER_CONFIG_JSON }}' > ~/.docker/config.json

      - name: Pull existing image for cache
        run: docker pull ${{ secrets.DO_REGISTRY }}/${{ secrets.DO_REGISTRY_IMAGE }}-backend:${{ github.ref_name }} || true

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DO_REGISTRY }}/${{ secrets.DO_REGISTRY_IMAGE }}-backend:${{ github.ref_name }} \
            -f apps/backend/Dockerfile \
            --cache-from ${{ secrets.DO_REGISTRY }}/${{ secrets.DO_REGISTRY_IMAGE }}-backend:${{ github.ref_name }} \
            .

      - name: Push Docker image
        run: docker push ${{ secrets.DO_REGISTRY }}/${{ secrets.DO_REGISTRY_IMAGE }}-backend:${{ github.ref_name }}

  # ============================================
  # DEPLOY PLACEHOLDER JOB
  # Placeholder for future SSH deployment automation
  #
  # Future deployment implementation (reference from .drone.yml):
  # 1. Install SSH client: apk add openssh
  # 2. Configure SSH key from secrets
  # 3. SSH to server: ssh root@app.versemate.org
  #    "cd ~/verse-mate && docker compose pull && docker compose up -d && docker system prune -a -f"
  # Required secrets for future: SSH_PRIVATE_KEY
  # ============================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker-push]
    if: github.event_name == 'push'
    steps:
      - name: Deploy placeholder
        run: echo "TODO - Implement deployment"
