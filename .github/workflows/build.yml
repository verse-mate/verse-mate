name: Build

on:
  push:
    branches: [ main, ci/*, release/* ]
    tags: [ 'v*.*.*' ] # version tags, eg. v1.2.3 or  v1.3.0-rc1
  pull_request:
    branches: [ main ]

env:
  CLOUDFLARE_ENV: |-
    ${{ 
      github.event_name == 'pull_request' && 'preview' 
      || startsWith(github.ref, 'refs/tags/v') && 'production' 
      || github.ref == 'refs/heads/main' && 'staging' 
      || 'staging'
    }}

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Build backend
        working-directory: ./apps/backend
        run: bun run build

      - name: Run backend tests
        working-directory: ./apps/backend
        run: |
          if ! bun test --passWithNoTests; then
            echo "::warning::Backend tests failed but continuing build"
          fi
        continue-on-error: true

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        working-directory: ./apps/frontend-next
        run: bun run build

      - name: Run frontend linting
        working-directory: ./apps/frontend-next
        run: bun run lint:ci

      - name: Run type checking
        working-directory: ./apps/frontend-next
        run: bun run tsc

  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Build website
        working-directory: ./apps/website
        run: bun run build

      - name: Run website linting
        working-directory: ./apps/website
        run: |
          if ! bun run lint; then
            echo "::warning::Website linting failed but continuing build"
          fi
        continue-on-error: true

  frontend-cloudflare-deploy:
    name: Frontend CloudFlare Deploy
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Build frontend for deployment
        working-directory: ./apps/frontend-next
        run: bun run build:worker

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./apps/frontend-next
          command: deploy --env ${{ env.CLOUDFLARE_ENV }}

  # Optional: Deploy preview for PRs
  frontend-cloudflare-deploy-preview:
    name: Frontend CloudFlare PR Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs: [build-backend, build-frontend]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Build frontend for deployment
        working-directory: ./apps/frontend-next
        run: bun run build:worker

      - name: Deploy Preview to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./apps/frontend-next
          command: versions upload --env ${{ env.CLOUDFLARE_ENV }} --preview-alias pr-${{ github.event.number }}

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://pr-${{ github.event.number }}-v-m-preview-app.verse-mate.workers.dev`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Frontend preview deployment is ready! Check it out at: ${previewUrl}`
            })

  website-cloudflare-deploy:
    name: Website CloudFlare Deploy
    runs-on: ubuntu-latest
    needs: [build-backend, build-website]
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Build website for deployment
        working-directory: ./apps/website
        run: bun run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./apps/website
          command: deploy --env ${{ env.CLOUDFLARE_ENV }}

  # Optional: Deploy preview for PRs
  website-cloudflare-deploy-preview:
    name: Website CloudFlare PR Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs: [build-backend, build-website]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Build website for deployment
        working-directory: ./apps/website
        run: bun run build

      - name: Deploy Preview to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./apps/website
          command: versions upload --env ${{ env.CLOUDFLARE_ENV }} --preview-alias pr-${{ github.event.number }}

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://pr-${{ github.event.number }}-verse-mate-website-preview.verse-mate.workers.dev`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Website preview deployment is ready! Check it out at: ${previewUrl}`
            })
