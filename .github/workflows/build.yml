name: Build

on:
  push:
    branches: [ main, ci/*, release/* ]
    tags: [ 'v*.*.*' ] # version tags, eg. v1.2.3 or  v1.3.0-rc1
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'How to bump the version?'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - manual
      manual_version:
        description: 'Manual version (required if bump_type is manual)'
        required: false
        type: string

env:
  CLOUDFLARE_ENV: |-
    ${{
      github.event_name == 'pull_request' && 'preview'
      || startsWith(github.ref, 'refs/tags/v') && 'production'
      || github.ref == 'refs/heads/main' && 'staging'
      || 'staging'
    }}

jobs:
  tag-version:
    name: Tag Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Calculate and Push Tag
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BUMP_INPUT: ${{ inputs.bump_type }}
          MANUAL_VERSION: ${{ inputs.manual_version }}
        run: |
          echo "Triggered by $EVENT on $REF"

          BUMP_TYPE="none"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            BUMP_TYPE="$BUMP_INPUT"
          elif [ "$EVENT" = "push" ]; then
            echo "Commit message: $COMMIT_MSG"

            if [[ "$COMMIT_MSG" == *"[major]"* ]]; then
              BUMP_TYPE="major"
            elif [[ "$COMMIT_MSG" == *"[minor]"* ]]; then
              BUMP_TYPE="minor"
            elif [[ "$COMMIT_MSG" == *"[patch]"* ]]; then
              BUMP_TYPE="patch"
            fi
          fi

          echo "Bump Type: $BUMP_TYPE"

          if [ "$BUMP_TYPE" != "none" ]; then
            # Configure git
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "Latest tag: $LATEST_TAG"

            VERSION=""
            if [ "$BUMP_TYPE" = "manual" ]; then
              VERSION="$MANUAL_VERSION"
            else
              CLEAN_TAG=${LATEST_TAG#v}
              IFS='.' read -r major minor patch <<< "$CLEAN_TAG"
              major=${major:-0}
              minor=${minor:-0}
              patch=${patch:-0}

              if [ "$BUMP_TYPE" = "major" ]; then
                major=$((major + 1))
                minor=0
                patch=0
              elif [ "$BUMP_TYPE" = "minor" ]; then
                minor=$((minor + 1))
                patch=0
              else
                patch=$((patch + 1))
              fi
              VERSION="$major.$minor.$patch"
            fi

            NEW_TAG="v$VERSION"
            echo "Calculated new tag: $NEW_TAG"

            # Create and push tag
            git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
            git push origin "$NEW_TAG"
          else
            echo "No version bump detected."
          fi

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Build backend
        working-directory: ./apps/backend
        run: bun run build

      - name: Run backend tests
        working-directory: ./apps/backend
        run: |
          if ! bun test --passWithNoTests; then
            echo "::warning::Backend tests failed but continuing build"
          fi
        continue-on-error: true

  build-admin:
    # Admin-only Next.js app (admin.versemate.org). End-user surfaces moved
    # to verse-mate-mobile / verse-mate-web in VERA-18.
    name: Build Admin (frontend-next)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Run frontend linting
        working-directory: ./
        run: bun run lint

      - name: Run type checking
        working-directory: ./apps/frontend-next
        run: bun run tsc

      - name: Build frontend
        working-directory: ./apps/frontend-next
        run: bun run build

  build-website:
    name: Build Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Build website
        working-directory: ./apps/website
        run: bun run build

      - name: Run website linting
        working-directory: ./apps/website
        run: |
          if ! bun run lint; then
            echo "::warning::Website linting failed but continuing build"
          fi
        continue-on-error: true

  admin-cloudflare-deploy:
    # Deploys the admin-only Next.js app (admin.versemate.org). End-user
    # surfaces live in verse-mate-mobile / verse-mate-web — not here.
    name: Admin CloudFlare Deploy
    runs-on: ubuntu-latest
    needs: [build-backend, build-admin]
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Build frontend for deployment
        working-directory: ./apps/frontend-next
        run: bun run build:worker

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./apps/frontend-next
          command: deploy --env ${{ env.CLOUDFLARE_ENV }}

  # Optional: Deploy preview for PRs (admin app only)
  admin-cloudflare-deploy-preview:
    name: Admin CloudFlare PR Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs: [build-backend, build-admin]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Build frontend for deployment
        working-directory: ./apps/frontend-next
        run: bun run build:worker

      - name: Deploy Preview to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./apps/frontend-next
          command: versions upload --env ${{ env.CLOUDFLARE_ENV }} --preview-alias pr-${{ github.event.number }}

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://pr-${{ github.event.number }}-v-m-preview-app.verse-mate.workers.dev`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Admin preview deployment is ready! Check it out at: ${previewUrl}`
            })

  website-cloudflare-deploy:
    name: Website CloudFlare Deploy
    runs-on: ubuntu-latest
    needs: [build-backend, build-website]
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Build website for deployment
        working-directory: ./apps/website
        run: bun run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./apps/website
          command: deploy --env ${{ env.CLOUDFLARE_ENV }}

  # Optional: Deploy preview for PRs
  website-cloudflare-deploy-preview:
    name: Website CloudFlare PR Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs: [build-backend, build-website]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Build website for deployment
        working-directory: ./apps/website
        run: bun run build

      - name: Deploy Preview to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ./apps/website
          command: versions upload --env ${{ env.CLOUDFLARE_ENV }} --preview-alias pr-${{ github.event.number }}

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://pr-${{ github.event.number }}-verse-mate-website-preview.verse-mate.workers.dev`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Website preview deployment is ready! Check it out at: ${previewUrl}`
            })

